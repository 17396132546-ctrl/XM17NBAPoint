name: Build Xiaomi 17 Pro Max NBA BackScreen APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          BEST_DIR=""
          BEST_CODE=-1
          BEST_NAME="unknown"

          while IFS= read -r settings_file; do
            DIR=$(dirname "$settings_file")
            GRADLE_FILE="$DIR/app/build.gradle.kts"
            if [ -f "$GRADLE_FILE" ]; then
              CODE=$(grep -E 'versionCode[[:space:]]*=' "$GRADLE_FILE" | head -n1 | grep -oE '[0-9]+' || true)
              CODE=${CODE:-0}
              NAME=$(grep -E 'versionName[[:space:]]*=' "$GRADLE_FILE" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "unknown")
              echo "发现工程: $DIR (versionCode=$CODE, versionName=$NAME)"
              if [ "$CODE" -gt "$BEST_CODE" ]; then
                BEST_CODE=$CODE
                BEST_DIR="$DIR"
                BEST_NAME="$NAME"
              fi
            fi
          done < <(find . -name 'settings.gradle.kts' -print)

          if [ -z "$BEST_DIR" ]; then
            echo "未找到有效的 Android 工程目录"
            exit 1
          fi

          echo "最终锁定编译目录: $BEST_DIR (v$BEST_NAME)"
          cd "$BEST_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-v${BEST_NAME}.apk"
          echo "VER_NAME=$BEST_NAME" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi17-NBA-BackScreen-v${{ env.VER_NAME }}-APK
          path: app-v${{ env.VER_NAME }}.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER_NAME }}
          name: 小米17 Pro Max NBA背屏安装包 v${{ env.VER_NAME }}
          files: |
            app-v${{ env.VER_NAME }}.apk
            app-debug.apk
